# ONNX export of the chosen model (training/scripts/export_onnx.py, Mac, CPU, ~1 min).
# Not training: Ultralytics only traces the network. Files are gitignored and published
# as GitHub release assets in Week 5.

export:
  name: baseline            # output files: <out_dir>/<name>-<size>.onnx
  sizes: [640, 480, 320]    # one fixed-shape model per input size (experiment 3)
  opset: 17                 # onnxruntime >= 1.17 (pyproject floor) runs opset <= 20
  simplify: true            # onnxslim graph cleanup; outputs are unchanged
  out_dir: models

check:                      # training/scripts/check_onnx.py: package vs Ultralytics
  n_images: 20              # val images (seeded sample), each in 4 shapes
  seed: 0
  min_iou: 0.98             # mean matched pothole mask IoU vs Ultralytics on the same ONNX
  max_unmatched_conf: 0.3   # no instance above this score may be found by only one side
