# Single source of truth for run-time settings.
# The package never reads this file: apps load it and pass the values in.
# tests/test_config_sync.py checks that the package defaults match these values.

segmenter:
  input_size: null        # null = read from the ONNX model's input shape
  conf: 0.25
  mask_threshold: 0.5
  iou: 0.5               # NMS overlap; Ultralytics' predict default
  fill_road: true         # road mask = road ∪ potholes (Week 3: road IoU 0.908 -> 0.927)

severity:
  # Upper bounds of "small" and "medium"; anything above is "large".
  frac: [0.0012, 0.0066]  # pothole area / frame area: tertiles of merged-v1 train labels
  m2: [0.1, 0.5]          # square metres, used only when metres_per_px is given

postprocess:
  min_part: 0.1           # clean_mask: keep extra mask parts >= 0.1 x the largest part

tracker:
  frame_rate: 30.0
